name: Build Windows

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PROJECT_NAME: ArgosyTides
  BUILD_CONFIG: Development

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        lfs: true
    
    - name: Setup Git LFS
      run: git lfs pull
    
    - name: Check Unreal Engine Installation
      shell: pwsh
      run: |
        $uePath = 'C:\Program Files\Epic Games\UE_5.4\Engine\Build\BatchFiles\Build.bat'
        if (-not (Test-Path $uePath)) {
          Write-Error "Unreal Engine 5.4 is not installed on this runner. Use a self-hosted runner or install UE5 before running this workflow."
          exit 1
        }
        Write-Host "Unreal Engine path found: $uePath"

    - name: Build Project
      run: |
        $UE5_PATH = "C:\Program Files\Epic Games\UE_5.4\Engine\Build\BatchFiles"
        & "$UE5_PATH\Build.bat" $env:PROJECT_NAME Win64 $env:BUILD_CONFIG -project="${{ github.workspace }}\$env:PROJECT_NAME.uproject" -log -wait
      shell: pwsh
    
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ArgosyTides-Windows-Build
        path: |
          Binaries/Win64/
          Content/
        retention-days: 7
