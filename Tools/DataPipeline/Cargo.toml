[package]
name = "data_pipeline"
version = "0.1.0"
edition = "2021"
description = "Argosy Tides - Real-world data fetching and processing pipeline"
authors = ["Argosy Tides Team"]

[dependencies]
# HTTP client
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# SQLite
rusqlite = { version = "0.30", features = ["bundled"] }

# Configuration
config = "0.13"

# CLI
clap = { version = "4.4", features = ["derive"] }

[dev-dependencies]
mockito = "1.2"
tokio-test = "0.4"

[[bin]]
name = "data_pipeline"
path = "src/main.rs"

[lib]
name = "data_pipeline"
path = "src/lib.rs"
